name: Build Tweak

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK Version"
        default: "26.5"
        required: true
        type: string
      target_version:
        description: "Target iOS Version"
        default: "15.0"
        required: true
        type: string
      decrypted_ipa_url:
        description: "Direct URL of an X IPA"
        default: ""
        required: true
        type: string
      deploy_format:
        description: "Deployment format"
        default: sideloaded
        required: true
        type: choice
        options: [rootfull, sideloaded, trollstore, rootless]
      twitter_branding:
        description: "Set app name to Twitter (IPA builds only)"
        default: false
        required: false
        type: boolean
      resource_pack_url:
        description: "Override app icons (.ZIP) (IPA builds only)"
        default: ""
        required: false
        type: string
      commit_id:
        description: "(Optional) Commit ID to build at"
        default: ""
        required: false
        type: string
      upload_artifact:
        description: "Upload IPA as artifact (Public)"
        default: true
        required: false
        type: boolean
      create_release:
        description: "Create a draft release (Private)"
        default: false
        required: false
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch-and-monitor:
    name: Dispatch runner candidates and wait for the winner
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - name: Dispatch candidates, cancel losers, and monitor build
        timeout-minutes: 365
        uses: actions/github-script@v8
        env:
          SDK_VERSION: ${{ inputs.sdk_version }}
          TARGET_VERSION: ${{ inputs.target_version }}
          IPA_URL: ${{ inputs.decrypted_ipa_url }}
          DEPLOY_FORMAT: ${{ inputs.deploy_format }}
          TWITTER_BRANDING: ${{ inputs.twitter_branding }}
          RESOURCE_PACK_URL: ${{ inputs.resource_pack_url }}
          COMMIT_ID: ${{ inputs.commit_id }}
          UPLOAD_ARTIFACT: ${{ inputs.upload_artifact }}
          CREATE_RELEASE: ${{ inputs.create_release }}
        with:
          script: |
            const raceId = `${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`;
            const branch = context.ref.replace(/^refs\/heads\//, '');
            const { data: oldRuns } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'runner-race-candidate.yml',
              branch,
              event: 'workflow_dispatch',
              per_page: 100
            });
            for (const run of oldRuns.workflow_runs) {
              if (!run.display_title.startsWith('RR-') || run.status === 'completed') continue;
              const parentId = Number(run.display_title.split('-')[1]);
              if (!Number.isFinite(parentId) || parentId === context.runId) continue;
              const { data: parent } = await github.rest.actions.getWorkflowRun({
                ...context.repo,
                run_id: parentId
              });
              if (parent.status === 'completed' && parent.conclusion === 'cancelled') {
                core.info(`Cancelling orphaned candidate ${run.display_title}.`);
                await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id });
              }
            }
            const runners = ['macos-26', 'macos-26-intel', 'xcode-27'];
            const candidateInputs = runner => ({
              race_id: raceId,
              runner,
              purpose: 'build',
              coordinator_run_id: String(context.runId),
              sdk_version: process.env.SDK_VERSION,
              target_version: process.env.TARGET_VERSION,
              decrypted_ipa_url: process.env.IPA_URL,
              deploy_format: process.env.DEPLOY_FORMAT,
              twitter_branding: process.env.TWITTER_BRANDING === 'true',
              resource_pack_url: process.env.RESOURCE_PACK_URL,
              commit_id: process.env.COMMIT_ID,
              upload_artifact: process.env.UPLOAD_ARTIFACT === 'true',
              create_release: process.env.CREATE_RELEASE === 'true'
            });
            await Promise.all(runners.map(runner =>
              github.rest.actions.createWorkflowDispatch({
                ...context.repo,
                workflow_id: 'runner-race-candidate.yml',
                ref: branch,
                inputs: candidateInputs(runner)
              })
            ));

            const prefix = `RR-${raceId}-`;
            const deadline = Date.now() + 6 * 60 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: 'runner-race-candidate.yml',
                branch,
                event: 'workflow_dispatch',
                per_page: 100
              });
              const candidates = data.workflow_runs.filter(run => run.display_title.startsWith(prefix));
              const finished = candidates.find(run =>
                run.status === 'completed' && ['success', 'failure'].includes(run.conclusion)
              );
              if (finished) {
                core.info(`Winner run: ${finished.html_url}`);
                if (finished.conclusion === 'failure') core.setFailed(`Winner build failed: ${finished.html_url}`);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed('Timed out waiting for the winning build runner.');

      - name: Cancel candidate runs if coordinator stops
        if: always() && (cancelled() || failure())
        uses: actions/github-script@v8
        env:
          RACE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const prefix = `RR-${process.env.RACE_ID}-`;
            const branch = context.ref.replace(/^refs\\/heads\\//, '');
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'runner-race-candidate.yml',
              branch,
              event: 'workflow_dispatch',
              per_page: 100
            });
            for (const run of data.workflow_runs) {
              if (run.display_title.startsWith(prefix) && run.status !== 'completed') {
                await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id });
              }
            }
