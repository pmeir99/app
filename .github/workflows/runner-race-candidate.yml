name: First Runner Candidate
run-name: RR-${{ inputs.race_id }}-${{ inputs.runner }}

on:
  workflow_dispatch:
    inputs:
      race_id:
        description: Unique coordinator run ID
        required: true
        type: string
      runner:
        description: Candidate runner
        required: true
        type: choice
        options: [macos-26, macos-26-intel, xcode-27]
      purpose:
        description: Work to perform
        required: true
        type: choice
        options: [tests, build]
      sdk_version:
        description: iOS SDK version
        required: false
        default: "26.5"
        type: string
      target_version:
        description: Target iOS version
        required: false
        default: "15.0"
        type: string
      decrypted_ipa_url:
        description: Direct URL of an X IPA
        required: false
        type: string
      deploy_format:
        description: Deployment format
        required: false
        default: sideloaded
        type: choice
        options: [rootfull, sideloaded, trollstore, rootless]
      twitter_branding:
        description: Use Twitter branding
        required: false
        default: false
        type: boolean
      resource_pack_url:
        description: Optional icon resource pack URL
        required: false
        type: string
      commit_id:
        description: Optional source commit
        required: false
        type: string
      upload_artifact:
        description: Upload IPA artifact
        required: false
        default: true
        type: boolean
      create_release:
        description: Create a draft release
        required: false
        default: false
        type: boolean
      coordinator_run_id:
        description: Parent workflow run ID
        required: true
        type: string

permissions:
  actions: write
  contents: write

jobs:
  candidate:
    name: Candidate on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - name: Export cache service credentials
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);

      - name: Claim runner race atomically
        id: claim
        run: |
          set -euo pipefail
          url="${ACTIONS_CACHE_URL%/}/_apis/artifactcache/caches?api-version=6.0-preview"
          payload=$(printf '{"key":"runner-race-%s","version":"runner-race-v1"}' "${{ inputs.race_id }}")
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/race-claim-response.json" --write-out '%{http_code}' \\
            --request POST "$url" \\
            --header "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \\
            --header "Content-Type: application/json" \\
            --data "$payload")
          case "$status" in
            201)
              echo "winner=true" >> "$GITHUB_OUTPUT"
              echo "This runner reserved the race claim."
              ;;
            409)
              echo "winner=false" >> "$GITHUB_OUTPUT"
              echo "Another runner already reserved the race claim."
              ;;
            *)
              cat "$RUNNER_TEMP/race-claim-response.json" >&2
              echo "Unexpected cache reservation response: HTTP $status" >&2
              exit 1
              ;;
          esac

      - name: Cancel this losing candidate
        if: steps.claim.outputs.winner != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              ...context.repo,
              run_id: context.runId
            });

      - name: Cancel all other queued or running candidates
        if: steps.claim.outputs.winner == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const racePrefix = `RR-${{ inputs.race_id }}-`;
            const branch = context.ref.replace(/^refs\/heads\//, '');
            let peers = [];
            // Dispatch calls are issued together by the coordinator. Allow GitHub
            // a short window to register every candidate, then cancel queued peers.
            for (let attempt = 0; attempt < 15; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: 'runner-race-candidate.yml',
                branch,
                event: 'workflow_dispatch',
                per_page: 100
              });
              peers = data.workflow_runs.filter(run =>
                run.display_title.startsWith(racePrefix) &&
                run.id !== context.runId
              );
              if (peers.length >= 2) break;
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
            for (const peer of peers) {
              if (peer.status !== 'completed') {
                core.info(`Cancelling ${peer.display_title} (${peer.status}).`);
                await github.rest.actions.cancelWorkflowRun({
                  ...context.repo,
                  run_id: peer.id
                });
              }
            }

            // Clean up candidates orphaned when an older coordinator was cancelled.
            const { data: allRuns } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'runner-race-candidate.yml',
              branch,
              event: 'workflow_dispatch',
              per_page: 100
            });
            for (const run of allRuns.workflow_runs) {
              const match = run.display_title.match(/^RR-(\\d+)-(\\d+)-/);
              if (!match || Number(match[1]) === context.payload.inputs.coordinator_run_id || run.status === 'completed') continue;
              const parentId = Number(match[1]);
              const { data: parent } = await github.rest.actions.getWorkflowRun({
                ...context.repo,
                run_id: parentId
              });
              if (parent.status === 'completed' && parent.conclusion === 'cancelled') {
                core.info(`Cancelling orphaned candidate ${run.display_title}.`);
                await github.rest.actions.cancelWorkflowRun({
                  ...context.repo,
                  run_id: run.id
                });
              }
            }

      - name: Checkout source
        if: steps.claim.outputs.winner == 'true'
        uses: actions/checkout@v6
        with:
          path: main
          ref: ${{ inputs.commit_id || github.ref }}
          submodules: recursive
          persist-credentials: false

      - name: Run Localization Tests
        if: steps.claim.outputs.winner == 'true' && inputs.purpose == 'tests'
        uses: ./main/.github/actions/test-localization

      - name: Run Formatting Tests
        if: steps.claim.outputs.winner == 'true' && inputs.purpose == 'tests'
        uses: ./main/.github/actions/test-formatting

      - name: Run Build Tests
        if: steps.claim.outputs.winner == 'true' && inputs.purpose == 'tests'
        uses: ./main/.github/actions/test-build
        env:
          THEOS: ${{ github.workspace }}/theos
          BUILD_DIR: ${{ github.workspace }}/ffmpeg-build

      - name: Get Tweak Info
        if: steps.claim.outputs.winner == 'true' && inputs.purpose == 'build'
        id: tweak_info
        run: |
          TWEAK_NAME=$(sed -n 's/^Name: *//p' main/control)
          TWEAK_VERSION=$(awk '/Version:/ {print $2}' main/control)
          echo "name=${TWEAK_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${TWEAK_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        if: steps.claim.outputs.winner == 'true' && inputs.purpose == 'build'
        run: brew install make dpkg ldid

      - name: Add GNU Make to PATH
        if: steps.claim.outputs.winner == 'true' && inputs.purpose == 'build'
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Download Theos
        if: steps.claim.outputs.winner == 'true' && inputs.purpose == 'build'
        uses: actions/checkout@v6
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: Install cyan
        if: steps.claim.outputs.winner == 'true' && inputs.purpose == 'build' && (inputs.deploy_format == 'sideloaded' || inputs.deploy_format == 'trollstore')
        run: pip install https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Cache iOS SDK
        if: steps.claim.outputs.winner == 'true' && inputs.purpose == 'build'
        uses: actions/cache@v6
        with:
          path: theos/sdks/
          key: iOS-${{ inputs.sdk_version }}-SDK

      - name: Ensure iOS SDK is installed
        if: steps.claim.outputs.winner == 'true' && inputs.purpose == 'build'
        run: |
          if [[ ! -d "${THEOS}/sdks/iPhoneOS${SDK_VERSION}.sdk" ]]; then
            git clone -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs sdks
            cd sdks
            git sparse-checkout set --no-cone "iPhoneOS${SDK_VERSION}.sdk"
            git checkout
            test -d "iPhoneOS${SDK_VERSION}.sdk"
            mkdir -p "${THEOS}/sdks"
            mv "iPhoneOS${SDK_VERSION}.sdk" "${THEOS}/sdks/"
          fi
        env:
          THEOS: ${{ github.workspace }}/theos
          SDK_VERSION: ${{ inputs.sdk_version }}

      - name: Prepare X IPA
        if: steps.claim.outputs.winner == 'true' && inputs.purpose == 'build' && (inputs.deploy_format == 'sideloaded' || inputs.deploy_format == 'trollstore')
        id: x_version
        run: |
          mkdir -p main/packages main/tmp
          wget "$IPA_URL" --no-verbose -O main/packages/com.atebits.Tweetie2.ipa
          unzip -q main/packages/com.atebits.Tweetie2.ipa -d main/tmp
          X_VERSION=$(grep -A 1 '<key>CFBundleShortVersionString</key>' main/tmp/Payload/Twitter.app/Info.plist | grep '<string>' | awk -F'[><]' '{print $3}')
          echo "version=$X_VERSION" >> "$GITHUB_OUTPUT"
        env:
          IPA_URL: ${{ inputs.decrypted_ipa_url }}

      - name: Prepare Image Pack
        if: steps.claim.outputs.winner == 'true' && inputs.purpose == 'build' && inputs.resource_pack_url != '' && (inputs.deploy_format == 'sideloaded' || inputs.deploy_format == 'trollstore')
        run: wget "$IMAGE_URL" --no-verbose -O main/resource-pack.zip
        env:
          IMAGE_URL: ${{ inputs.resource_pack_url }}

      - name: Compute ffmpeg Cache Key
        if: steps.claim.outputs.winner == 'true' && inputs.purpose == 'build'
        id: ffmpeg-key
        run: echo "key=ffmpeg-stack-${{ runner.arch }}-sdk$(xcrun --sdk iphoneos --show-sdk-version)-$(git -C main rev-parse --short HEAD:deps/ffmpeg-kit-next/upstream)-${{ hashFiles('main/deps/ffmpeg-kit-next/build-ffmpeg.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Cache ffmpeg Stack
        if: steps.claim.outputs.winner == 'true' && inputs.purpose == 'build'
        uses: actions/cache@v6
        with:
          path: |
            ffmpeg-build
            main/deps/ffmpeg-kit-next/build
          key: ${{ steps.ffmpeg-key.outputs.key }}

      - name: Build Package
        if: steps.claim.outputs.winner == 'true' && inputs.purpose == 'build'
        run: |
          cd main
          for makefile in Makefile deps/flex/Makefile deps/CallessKit/Makefile deps/zxPluginsInject/upstream/Makefile; do
            if [[ -f "$makefile" ]]; then
              sed -i '' -E "s/^(TARGET[[:space:]]*:?=[[:space:]]*iphone:clang:)[^:]+:/\\1${SDK_VERSION}:/" "$makefile"
            fi
          done
          sed -i '' "s/^TARGET.*$/TARGET := iphone:clang:${SDK_VERSION}:${TARGET_VERSION}/" Makefile
          ./build.sh --${DEPLOY_FORMAT}
        env:
          THEOS: ${{ github.workspace }}/theos
          BUILD_DIR: ${{ github.workspace }}/ffmpeg-build
          SDK_VERSION: ${{ inputs.sdk_version }}
          TARGET_VERSION: ${{ inputs.target_version }}
          DEPLOY_FORMAT: ${{ inputs.deploy_format }}

      - name: Rebrand IPA
        if: steps.claim.outputs.winner == 'true' && inputs.purpose == 'build' && (inputs.deploy_format == 'sideloaded' || inputs.deploy_format == 'trollstore') && (inputs.twitter_branding || inputs.resource_pack_url != '')
        run: |
          cd main
          IMAGE_FLAG=""
          if [ -f resource-pack.zip ]; then IMAGE_FLAG="--resource-pack resource-pack.zip"; fi
          ./rebrand.sh${{ inputs.twitter_branding && ' --twitter-branding' || '' }} $IMAGE_FLAG "packages/$(ls -t packages | head -n1)"

      - name: Rename IPA
        if: steps.claim.outputs.winner == 'true' && inputs.purpose == 'build' && (inputs.deploy_format == 'sideloaded' || inputs.deploy_format == 'trollstore')
        run: |
          TWEAK_NAME=$(sed -n 's/^Name: *//p' main/control)
          TWEAK_VERSION=$(awk '/Version:/ {print $2}' main/control)
          BRANDING=X
          if [[ "$TWITTER_BRANDING" == "true" ]]; then BRANDING=Twitter; fi
          IPA_EXT=ipa
          if [[ "$DEPLOY_FORMAT" == "trollstore" ]]; then IPA_EXT=tipa; fi
          mv "main/packages/$(ls -t main/packages | head -n1)" "main/packages/${TWEAK_NAME}-${BRANDING}-${DEPLOY_FORMAT}_${TWEAK_VERSION}_${X_VERSION}.${IPA_EXT}"
        env:
          TWITTER_BRANDING: ${{ inputs.twitter_branding }}
          DEPLOY_FORMAT: ${{ inputs.deploy_format }}
          X_VERSION: ${{ steps.x_version.outputs.version }}

      - name: Upload Artifact
        if: steps.claim.outputs.winner == 'true' && inputs.purpose == 'build' && inputs.upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.tweak_info.outputs.name }}_${{ steps.tweak_info.outputs.version }}
          path: main/packages/*
          archive: false
          if-no-files-found: error

      - name: Create Draft Release
        if: steps.claim.outputs.winner == 'true' && inputs.purpose == 'build' && inputs.create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.tweak_info.outputs.version }}
          name: v${{ steps.tweak_info.outputs.version }}
          draft: true
          files: main/packages/*

      - name: Release runner claim
        if: always() && steps.claim.outputs.winner == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const ref = `heads/ci-runner-race/${{ inputs.race_id }}`;
            try {
              await github.rest.git.deleteRef({ ...context.repo, ref });
            } catch (error) {
              if (error.status !== 422 || !/reference does not exist/i.test(error.message)) throw error;
            }
