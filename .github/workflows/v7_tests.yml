name: v7 Tests

on:
  pull_request:
  push:
    branches: [v7]

permissions:
  contents: write

concurrency:
  group: v7-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel, xcode-27]

    steps:
      # Race compatible macOS runners and let the first one perform the suite.
      - name: Claim first available runner
        id: claim
        uses: actions/github-script@v8
        with:
          script: |
            const ref = `heads/ci-runner-race/tests-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`;
            try {
              await github.rest.git.createRef({ ...context.repo, ref: 'refs/' + ref, sha: context.sha });
              core.setOutput('winner', 'true');
            } catch (error) {
              if (error.status !== 422 || !/reference already exists/i.test(error.message)) throw error;
              core.info('Another compatible runner claimed the test run.');
              core.setOutput('winner', 'false');
            }

      - name: Checkout repository
        if: steps.claim.outputs.winner == 'true'
        uses: actions/checkout@v6
        with:
          path: main
          submodules: recursive
          persist-credentials: false

      - name: Run Localization Tests
        if: steps.claim.outputs.winner == 'true'
        uses: ./main/.github/actions/test-localization

      - name: Run Formatting Tests
        if: steps.claim.outputs.winner == 'true'
        uses: ./main/.github/actions/test-formatting

      - name: Run Build Tests
        if: steps.claim.outputs.winner == 'true'
        uses: ./main/.github/actions/test-build
        env:
          THEOS: ${{ github.workspace }}/theos
          BUILD_DIR: ${{ github.workspace }}/ffmpeg-build

      - name: Release runner claim
        if: always() && steps.claim.outputs.winner == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const ref = `heads/ci-runner-race/tests-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`;
            try {
              await github.rest.git.deleteRef({ ...context.repo, ref });
            } catch (error) {
              if (error.status !== 422 || !/reference does not exist/i.test(error.message)) throw error;
            }
