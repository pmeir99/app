name: v7 Tests

on:
  pull_request:
  push:
    branches: [v7]

permissions:
  actions: write
  contents: write

concurrency:
  group: v7-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  race:
    if: github.event_name == 'push'
    name: Dispatch and monitor first compatible runner
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - name: Dispatch candidates, cancel the losers, and monitor the winner
        uses: actions/github-script@v8
        with:
          script: |
            const raceId = `${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`;
            const branch = context.ref.replace(/^refs\/heads\//, '');
            const { data: oldRuns } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'runner-race-candidate.yml',
              branch,
              event: 'workflow_dispatch',
              per_page: 100
            });
            const activeOldRuns = oldRuns.workflow_runs.filter(run =>
              run.display_title.startsWith('RR-') && run.status !== 'completed'
            );
            const oldParentIds = [...new Set(activeOldRuns.map(run =>
              Number(run.display_title.split('-')[1])
            ).filter(id => Number.isFinite(id) && id !== context.runId))];
            const parentResults = await Promise.all(oldParentIds.map(async run_id => {
              try {
                const { data } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id });
                return [run_id, data.status === 'completed' && data.conclusion === 'cancelled'];
              } catch (error) {
                core.warning(`Could not inspect old coordinator ${run_id}: ${error.message}`);
                return [run_id, false];
              }
            }));
            const cancelledParents = new Set(parentResults.filter(([, cancelled]) => cancelled).map(([id]) => id));
            await Promise.all(activeOldRuns.filter(run =>
              cancelledParents.has(Number(run.display_title.split('-')[1]))
            ).map(run => {
              core.info(`Cancelling orphaned candidate ${run.display_title}.`);
              return github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id });
            }));
            const runners = ['macos-26', 'macos-26-intel', 'xcode-27'];
            await Promise.all(runners.map(runner =>
              github.rest.actions.createWorkflowDispatch({
                ...context.repo,
                workflow_id: 'runner-race-candidate.yml',
                ref: branch,
                inputs: {
                  race_id: raceId,
                  runner,
                  purpose: 'tests',
                  coordinator_run_id: String(context.runId)
                }
              })
            ));

            const prefix = `RR-${raceId}-`;
            const deadline = Date.now() + 6 * 60 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: 'runner-race-candidate.yml',
                branch,
                event: 'workflow_dispatch',
                per_page: 100
              });
              const candidates = data.workflow_runs.filter(run => run.display_title.startsWith(prefix));
              const finished = candidates.find(run =>
                run.status === 'completed' && ['success', 'failure'].includes(run.conclusion)
              );
              if (finished) {
                core.info(`Winner run: ${finished.html_url}`);
                if (finished.conclusion === 'failure') core.setFailed(`Winner runner failed: ${finished.html_url}`);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed('Timed out waiting for the winning runner workflow.');

      - name: Cancel candidate runs if coordinator stops
        if: always() && (cancelled() || failure())
        uses: actions/github-script@v8
        env:
          RACE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const prefix = `RR-${process.env.RACE_ID}-`;
            const branch = context.ref.replace(/^refs\\/heads\\//, '');
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'runner-race-candidate.yml',
              branch,
              event: 'workflow_dispatch',
              per_page: 100
            });
            for (const run of data.workflow_runs) {
              if (run.display_title.startsWith(prefix) && run.status !== 'completed') {
                await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id });
              }
            }

  pull-request-tests:
    if: github.event_name == 'pull_request'
    name: Pull request tests
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: main
          submodules: recursive
          persist-credentials: false
      - name: Run Localization Tests
        uses: ./main/.github/actions/test-localization
      - name: Run Formatting Tests
        uses: ./main/.github/actions/test-formatting
      - name: Run Build Tests
        uses: ./main/.github/actions/test-build
        env:
          THEOS: ${{ github.workspace }}/theos
          BUILD_DIR: ${{ github.workspace }}/ffmpeg-build
