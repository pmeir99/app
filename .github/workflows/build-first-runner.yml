name: Build Tweak (First Available Runner)

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK Version"
        default: "26.5"
        required: true
        type: string
      target_version:
        description: "Target iOS Version"
        default: "15.0"
        required: true
      decrypted_ipa_url:
        description: "Direct URL of an X IPA"
        default: ""
        required: true
        type: string
      deploy_format:
        description: "Deployment format"
        default: sideloaded
        required: true
        type: choice
        options:
          - rootfull
          - sideloaded
          - trollstore
          - rootless
      twitter_branding:
        description: "Set app name to Twitter (IPA builds only)"
        default: false
        required: false
        type: boolean
      resource_pack_url:
        description: "Override app icons (.ZIP) (IPA builds only)"
        default: ""
        required: false
        type: string
      commit_id:
        description: "(Optional) Commit ID to build at"
        default: ""
        required: false
        type: string
      upload_artifact:
        description: "Upload IPA as artifact (Public)"
        default: true
        required: false
        type: boolean
      create_release:
        description: "Create a draft release (Private)"
        default: false
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Tweak on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel, xcode-27]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    steps:
      - name: Claim this build
        id: claim
        uses: actions/github-script@v8
        with:
          script: |
            const ref = `heads/ci-runner-race/${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`;
            try {
              await github.rest.git.createRef({ ...context.repo, ref: 'refs/' + ref, sha: context.sha });
              core.setOutput('winner', 'true');
            } catch (error) {
              if (error.status !== 422 || !/reference already exists/i.test(error.message)) throw error;
              core.info('Another runner claimed the build.');
              core.setOutput('winner', 'false');
            }

      - name: Checkout Main
        if: steps.claim.outputs.winner == 'true'
        uses: actions/checkout@v6
        with:
          path: main
          ref: ${{ github.event.inputs.commit_id || github.ref }}
          submodules: recursive

      - name: Install Dependencies
        if: steps.claim.outputs.winner == 'true'
        run: brew install make dpkg ldid

      - name: Add GNU Make to PATH
        if: steps.claim.outputs.winner == 'true'
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Download Theos
        if: steps.claim.outputs.winner == 'true'
        uses: actions/checkout@v6
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: Install cyan
        if: steps.claim.outputs.winner == 'true' && (inputs.deploy_format == 'sideloaded' || inputs.deploy_format == 'trollstore')
        run: pip install https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: iOS SDK Caching
        if: steps.claim.outputs.winner == 'true'
        id: SDK
        uses: actions/cache@v6
        env:
          cache-name: iOS-${{ inputs.sdk_version }}-SDK
        with:
          path: theos/sdks/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Ensure iOS SDK is installed
        if: steps.claim.outputs.winner == 'true'
        run: |
          if [[ ! -d "${THEOS}/sdks/iPhoneOS${SDK_VERSION}.sdk" ]]; then
            git clone -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs sdks
            cd sdks
            git sparse-checkout set --no-cone "iPhoneOS${SDK_VERSION}.sdk"
            git checkout
            if [[ ! -d "iPhoneOS${SDK_VERSION}.sdk" ]]; then
              echo "iPhoneOS${SDK_VERSION}.sdk was not found in the SDK repository." >&2
              exit 1
            fi
            mkdir -p "${THEOS}/sdks"
            mv "iPhoneOS${SDK_VERSION}.sdk" "${THEOS}/sdks/"
          fi
        env:
          THEOS: ${{ github.workspace }}/theos
          SDK_VERSION: ${{ inputs.sdk_version }}

      - name: Get Tweak Info
        if: steps.claim.outputs.winner == 'true'
        id: tweak_info
        run: |
          TWEAK_NAME=$(sed -n 's/^Name: *//p' main/control)
          TWEAK_VERSION=$(awk '/Version:/ {print $2}' main/control)
          echo "name=${TWEAK_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${TWEAK_VERSION}" >> "$GITHUB_OUTPUT"
          echo "$TWEAK_NAME $TWEAK_VERSION"

      - name: Prepare X IPA
        if: steps.claim.outputs.winner == 'true' && (inputs.deploy_format == 'sideloaded' || inputs.deploy_format == 'trollstore')
        id: x_version
        run: |
          wget "$IPA_URL" --no-verbose -O main/packages/com.atebits.Tweetie2.ipa
          unzip -q main/packages/com.atebits.Tweetie2.ipa -d main/tmp
          X_VERSION=$(grep -A 1 '<key>CFBundleShortVersionString</key>' main/tmp/Payload/Twitter.app/Info.plist |
            grep '<string>' | awk -F'[><]' '{print $3}')
          echo "version=${X_VERSION}" >> "$GITHUB_OUTPUT"
          echo "$X_VERSION"
        env:
          IPA_URL: ${{ inputs.decrypted_ipa_url }}

      - name: Prepare Image Pack
        if: steps.claim.outputs.winner == 'true' && (inputs.resource_pack_url != '' && (inputs.deploy_format == 'sideloaded' || inputs.deploy_format == 'trollstore'))
        run: |
          wget "$IMAGE_URL" --no-verbose -O main/resource-pack.zip
        env:
          IMAGE_URL: ${{ inputs.resource_pack_url }}

      - name: Compute ffmpeg Cache Key
        if: steps.claim.outputs.winner == 'true'
        id: ffmpeg-key
        run: |
          echo "key=ffmpeg-stack-${{ runner.arch }}-sdk$(xcrun --sdk iphoneos --show-sdk-version)-$(git -C main rev-parse --short HEAD:deps/ffmpeg-kit-next/upstream)-${{ hashFiles('main/deps/ffmpeg-kit-next/build-ffmpeg.sh') }}" >> "$GITHUB_OUTPUT"

      - name: ffmpeg Stack Caching
        if: steps.claim.outputs.winner == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ffmpeg-build
            main/deps/ffmpeg-kit-next/build
          key: ${{ steps.ffmpeg-key.outputs.key }}

      - name: Build Package
        if: steps.claim.outputs.winner == 'true'
        run: |
          cd ${{ github.workspace }}/main
          for makefile in Makefile deps/flex/Makefile deps/CallessKit/Makefile deps/zxPluginsInject/upstream/Makefile; do
            if [[ -f "$makefile" ]]; then
              sed -i '' -E "s/^(TARGET[[:space:]]*:?=[[:space:]]*iphone:clang:)[^:]+:/\\1${SDK_VERSION}:/" "$makefile"
            fi
          done
          sed -i '' "s/^TARGET.*$/TARGET := iphone:clang:${SDK_VERSION}:${TARGET_VERSION}/" Makefile
          ./build.sh --${{ inputs.deploy_format }}
        env:
          THEOS: ${{ github.workspace }}/theos
          BUILD_DIR: ${{ github.workspace }}/ffmpeg-build
          SDK_VERSION: ${{ inputs.sdk_version }}
          TARGET_VERSION: ${{ inputs.target_version }}

      - name: Rebrand IPA
        if: steps.claim.outputs.winner == 'true' && ((inputs.deploy_format == 'sideloaded' || inputs.deploy_format == 'trollstore') && (inputs.twitter_branding || inputs.resource_pack_url != ''))
        run: |
          cd ${{ github.workspace }}/main
          IMAGE_FLAG=""
          if [ -f resource-pack.zip ]; then IMAGE_FLAG="--resource-pack resource-pack.zip"; fi
          ./rebrand.sh${{ inputs.twitter_branding && ' --twitter-branding' || '' }} $IMAGE_FLAG \
            "packages/$(ls -t packages | head -n1)"

      - name: Rename IPA to include IPA version
        if: steps.claim.outputs.winner == 'true' && (inputs.deploy_format == 'sideloaded' || inputs.deploy_format == 'trollstore')
        run: |
          mv "main/packages/$(ls -t main/packages | head -n1)" \
             "main/packages/${{ steps.tweak_info.outputs.name }}-${BRANDING}-${{ inputs.deploy_format }}_${{ steps.tweak_info.outputs.version }}_${{ steps.x_version.outputs.version }}.${IPA_EXT}"
        env:
          IPA_EXT: ${{ inputs.deploy_format == 'trollstore' && 'tipa' || 'ipa' }}
          BRANDING: ${{ inputs.twitter_branding && 'Twitter' || 'X' }}

      - name: Pass package name
        if: steps.claim.outputs.winner == 'true'
        id: package_name
        run: |
          echo "package=$(ls -t main/packages | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Upload Artifact
        if: steps.claim.outputs.winner == 'true' && (inputs.upload_artifact)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.tweak_info.outputs.name }}_${{ steps.tweak_info.outputs.version }}
          path: ${{ github.workspace }}/main/packages/${{ steps.package_name.outputs.package }}
          archive: false
          if-no-files-found: error

      - name: Create Draft Release
        if: steps.claim.outputs.winner == 'true' && (inputs.create_release)
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.tweak_info.outputs.version }}
          name: v${{ steps.tweak_info.outputs.version }} - ${{ steps.tweak_info.outputs.name }}
          files: main/packages/${{ steps.package_name.outputs.package }}
          draft: true

  cleanup:
    name: Remove temporary runner claim
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const ref = `heads/ci-runner-race/${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`;
            try {
              await github.rest.git.deleteRef({ ...context.repo, ref });
            } catch (error) {
              if (error.status !== 422 || !/reference does not exist/i.test(error.message)) throw error;
            }
